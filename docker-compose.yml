version: '3.8'

services:
  # 1. Backend Service (Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pern_backend
    restart: always
    ports:
      - "8080:8080" # Maps host port 8080 to container port 8080
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules

  # 2. Frontend Service (React / Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pern_frontend
    restart: always
    ports:
      - "80:80" # Serves the production build via Nginx on port 80
    depends_on:
      - backend
